{% set name = "pandoc-attrs" %}
{% set version = "0.1.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b717e80f4739323c40993e248fd379f900ce3dfd4a596509df0b8a39aab11525

build:
  noarch: python
  number: 1
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pandocattrs

about:
  home: http://github.com/kiwi0fruit/pandoc-attrs
  license: "BSD 2-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: 'A simple parser / emitter for pandoc block attributes, intended for use with pandocfilters.'

extra:
  recipe-maintainers:
    - kiwi0fruit
